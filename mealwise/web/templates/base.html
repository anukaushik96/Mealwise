<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mealwise{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Mealwise</h1>
  <p class="sub">{% block tagline %}Know what to eat. Know what to spend.{% endblock %}</p>
  {% if error %}
    <div class="card" style="border-color:var(--bad)">
      <strong>Something went wrong:</strong> <code>{{ error }}</code>
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
