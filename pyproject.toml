[project]
name = "mealwise"
version = "0.1.0"
description = "AI food & spending manager on Swiggy MCP"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "asyncpg==0.30.0",
  "cryptography==50.0.0",
  "PyJWT==2.13.0",
  "anthropic==1.0.0",
  "mcp==2.0.0",
  "httpx==0.28.1",
]

[project.scripts]
mealwise-login = "mealwise.cli.login:main"
mealwise-order = "mealwise.cli.order:main"
mealwise-basket = "mealwise.cli.basket:main"
mealwise-dump-schemas = "mealwise.cli.dump_schemas:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mealwise"]
